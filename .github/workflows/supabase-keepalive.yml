name: supabase-keepalive

on:
  schedule:
    # UTC 00:17, 06:17, 12:17, 18:17 = Turkiye 03:17, 09:17, 15:17, 21:17
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  database-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: SWRocket veritabanini denetle
        shell: bash
        env:
          SUPABASE_URL: https://rrrprcvmtahetcrtucev.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SB_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SB_ANON_KEY GitHub secret tanimli degil."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in 1 2 3; do
            http_status="$(curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 30 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "${SUPABASE_URL}/rest/v1/rpc/swrocket_keepalive" || true)"

            if [ "$http_status" = "200" ] && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$response_file"; then
              echo "Supabase veritabani erisilebilir ve SWRocket keepalive dogrulandi."
              exit 0
            fi

            echo "Deneme ${attempt}/3 basarisiz (HTTP ${http_status:-yok})."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "::error::Supabase veritabani uc denemede dogrulanamadi."
          exit 1
